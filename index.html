<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f6f5f1">
  <!-- Fullscreen when added to the home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Out There">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/public/icon-192.png">
  <title>Out There — Find your kind of outside.</title>
  <link rel="stylesheet" href="/public/vendor/leaflet.css">
  <link rel="stylesheet" href="/public/vendor/maplibre-gl.css">
  <link rel="stylesheet" href="/src/styles.css">
  <link rel="stylesheet" href="/src/scrubber.css">
  <!-- Launch splash: inline so it paints before anything else loads -->
  <style>
    #splash{position:fixed;inset:0;z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#f6f5f1;color:#233c4b;transition:opacity .6s cubic-bezier(.22,.61,.36,1),visibility .6s;font-family:'Helvetica Neue',Helvetica,Arial,system-ui,sans-serif}
    #splash.hide{opacity:0;visibility:hidden}
    #splash svg{width:88px;height:88px;animation:splash-in .7s cubic-bezier(.2,.8,.25,1.1) both,splash-bob 2.4s ease-in-out .8s infinite}
    #splash .wordmark{font-size:22px;font-weight:500;letter-spacing:-.4px;animation:splash-fade .8s ease-out .25s both}
    #splash .wordmark i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#233c4b;margin-left:3px;vertical-align:middle}
    @keyframes splash-in{from{opacity:0;transform:translateY(10px) scale(.92)}}
    @keyframes splash-fade{from{opacity:0;transform:translateY(4px)}}
    @keyframes splash-bob{50%{transform:translateY(-4px)}}
    @media (prefers-reduced-motion:reduce){#splash svg,#splash .wordmark{animation:none}}
  </style>
</head>
<body>
  <div id="splash" aria-label="Out There" role="img">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c-2-.2-3.4 1.2-3.2 3.2.1 1.8 1.4 3 3.2 3s3-1.4 3-3.1S13.9 3.1 12 3Z"/><path d="M8.4 11.3c-1.8 1.3-2.4 4.4-2.1 6.4.2 1.1 1.2 1.5 2.2 1l.5 2.1c.3 1 1.7 1.1 2.1.1l.9-3.1.9 3.1c.4 1 1.9.9 2.1-.1l.5-2.1c1 .5 2 .1 2.2-1 .3-2-.3-5.1-2.1-6.4-1.5.7-5.7.7-7.2 0Z"/></svg>
    <span class="wordmark">out there</span>
  </div>
  <div id="app"></div>
  <script src="/public/vendor/leaflet.js"></script>
  <script src="/public/vendor/maplibre-gl.js"></script>
  <script src="/public/vendor/leaflet-maplibre-gl.js"></script>
  <script type="module" src="/src/app.js"></script>
  <script>
    // Show the launch splash for ~3 s, then ease it out into the map.
    (function () {
      var splash = document.getElementById('splash');
      function hide() {
        if (!splash || splash.classList.contains('hide')) return;
        splash.classList.add('hide');
        setTimeout(function () { splash.remove(); }, 700);
      }
      setTimeout(hide, Math.max(0, 3000 - performance.now()));
      splash.addEventListener('click', hide);
    })();
  </script>
</body>
</html>
